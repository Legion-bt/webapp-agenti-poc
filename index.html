<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenteGo ERP - B2B Sales Agent Portal & Multi-tenant Hub</title>
    <meta name="description" content="Piattaforma SaaS multi-tenant per agenti commerciali B2B, gestione ordini, listini dinamici, catalogo, monitoraggio vendite e sincronizzazione ERP centrale." />
    <meta property="og:title" content="AgenteGo ERP - B2B Sales Agent Portal & Multi-tenant Hub" />
    <meta property="og:description" content="Piattaforma SaaS multi-tenant per agenti commerciali B2B, gestione ordini, listini dinamici, catalogo, monitoraggio vendite e sincronizzazione ERP centrale." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('agentego_theme');
          var p = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (t === 'dark' || (!t && p)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
